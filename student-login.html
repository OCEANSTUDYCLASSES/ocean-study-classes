<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | Ocean Study Classes</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#041b43,#063b91);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:20px;
  padding:35px;
  box-shadow:0 20px 60px rgba(0,0,0,.30);
}

.logo-box{
  text-align:center;
  margin-bottom:20px;
}

.logo{
  width:80px;
  height:80px;
  object-fit:contain;
  border-radius:50%;
}

h1{
  text-align:center;
  color:#041b43;
  font-size:30px;
  margin-bottom:5px;
}

.subtitle{
  text-align:center;
  color:#68748a;
  margin-bottom:30px;
}

.input-box{
  margin-bottom:20px;
}

label{
  display:block;
  color:#18243a;
  font-weight:700;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:14px 15px;
  border:1px solid #d6dce7;
  border-radius:9px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#063b91;
  box-shadow:0 0 0 3px rgba(6,59,145,.10);
}

.login-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:9px;
  background:#ffc400;
  color:#111;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

.login-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:18px;
  padding:12px;
  border-radius:8px;
  text-align:center;
  font-weight:700;
}

.error{
  display:block;
  background:#ffe8e8;
  color:#b00020;
}

.success{
  display:block;
  background:#e7f7ed;
  color:#087a35;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#063b91;
  text-decoration:none;
  font-weight:700;
}

.register-link{
  text-align:center;
  margin-top:18px;
  color:#68748a;
  font-size:14px;
}
.register-link a{
  color:#063b91;
  font-weight:700;
  text-decoration:none;
}
.register-link a:hover{
  text-decoration:underline;
}

.footer{
  text-align:center;
  margin-top:25px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<div class="login-card">

  <div class="logo-box">
    <img src="images/logo.png"
         class="logo"
         alt="Ocean Study Classes Logo">
  </div>

  <h1>Student Login</h1>

  <p class="subtitle">Ocean Study Classes</p>

  <form id="loginForm">

    <div class="input-box">
      <label for="email">Gmail / Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your Gmail"
        autocomplete="email"
        required
      >
    </div>

    <div class="input-box">
      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >
    </div>

    <button
      type="submit"
      class="login-btn"
      id="loginBtn"
    >
      LOGIN
    </button>

    <div id="message" class="message"></div>

  </form>

  <div class="register-link">
    New Student? <a href="student-register.html">Register Here</a>
  </div>

  <a href="index.html" class="back">
    ← Back to Website
  </a>

  <div class="footer">
    OCEAN STUDY CLASSES<br>
    Your Success Our Passion
  </div>

</div>


<script type="module">

/* FIREBASE SDK */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey: "AIzaSyAegv8Y_0KgMyjwQIt_ZXqb9_5PNj5TufY",

  authDomain: "ocean-study-classes.firebaseapp.com",

  projectId: "ocean-study-classes",

  storageBucket: "ocean-study-classes.firebasestorage.app",

  messagingSenderId: "549818570531",

  appId: "1:549818570531:web:355ec0212ab1ff984e1e96",

  measurementId: "G-35V3E056Z"

};


/* INITIALIZE FIREBASE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/* ELEMENTS */

const form = document.getElementById("loginForm");

const emailInput = document.getElementById("email");

const passwordInput = document.getElementById("password");

const loginBtn = document.getElementById("loginBtn");

const message = document.getElementById("message");


/* MESSAGE */

function showMessage(text,type){

  message.textContent = text;

  message.className = "message " + type;

}


/* LOGIN */

form.addEventListener("submit", async (event) => {

  event.preventDefault();

  loginBtn.disabled = true;

  loginBtn.textContent = "LOGGING IN...";

  message.className = "message";


  const email = emailInput.value.trim();

  const password = passwordInput.value;


  try {

    console.log("Trying login:", email);

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );


    console.log("LOGIN SUCCESS");


    showMessage(
      "Login successful! Opening profile...",
      "success"
    );


    setTimeout(() => {

      window.location.href = "student-profile.html";

    }, 800);


  }

  catch(error){

    console.error(
      "FIREBASE ERROR:",
      error.code,
      error.message
    );


    let text = "Login failed.";


    if(error.code === "auth/invalid-credential"){

      text = "Gmail ya password galat hai.";

    }

    else if(error.code === "auth/user-not-found"){

      text = "Ye Gmail Firebase me registered nahi hai.";

    }

    else if(error.code === "auth/wrong-password"){

      text = "Password galat hai.";

    }

    else if(error.code === "auth/invalid-api-key"){

      text = "Firebase API Key galat hai.";

    }

    else if(error.code === "auth/network-request-failed"){

      text = "Internet connection problem hai.";

    }

    else{

      text = "Firebase Error: " + error.code;

    }


    showMessage(text,"error");

  }


  finally{

    loginBtn.disabled = false;

    loginBtn.textContent = "LOGIN";

  }

});

</script>

</body>
</html>
