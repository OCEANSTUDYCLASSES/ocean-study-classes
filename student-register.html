<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Registration | Ocean Study Classes</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #041b43, #063b91);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.25);
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo h1 {
      color: #063b91;
      font-size: 28px;
    }

    .logo p {
      color: #666;
      margin-top: 5px;
    }

    h2 {
      text-align: center;
      color: #041b43;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      color: #18243a;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd4e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #063b91;
      box-shadow: 0 0 0 2px rgba(6,59,145,0.1);
    }

    .register-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #ffc400;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .register-btn:hover {
      background: #eab500;
    }

    .register-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #e8f7ee;
      color: #146c36;
    }

    .error {
      background: #fdecec;
      color: #b42318;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #555;
    }

    .login-link a {
      color: #063b91;
      font-weight: bold;
      text-decoration: none;
    }

    .back-home {
      text-align: center;
      margin-top: 15px;
    }

    .back-home a {
      color: #063b91;
      text-decoration: none;
      font-size: 14px;
    }

    .password-note {
      font-size: 12px;
      color: #777;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <div class="register-box">

    <div class="logo">
      <h1>OCEAN STUDY CLASSES</h1>
      <p>Your Success Our Passion</p>
    </div>

    <h2>Student Registration</h2>

    <form id="registerForm">
    <div class="form-group">
  <label for="name">Student Name</label>

  <input
    type="text"
    id="name"
    placeholder="Enter your full name"
    required
  >
</div>

      <div class="form-group">
        <label for="mobile">Mobile Number</label>

        <input
          type="tel"
          id="mobile"
          placeholder="Enter 10-digit mobile number"
          maxlength="10"
          inputmode="numeric"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Gmail</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your Gmail"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Create password"
          minlength="6"
          required
        >

        <div class="password-note">
          Password must be at least 6 characters.
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Re-enter password"
          minlength="6"
          required
        >
      </div>

      <button
        type="submit"
        class="register-btn"
        id="registerBtn"
      >
        Create Account
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login-link">
      Already have an account?
      <a href="student-login.html">Login</a>
    </div>

    <div class="back-home">
      <a href="index.html">← Back to Website</a>
    </div>

  </div>


  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


  <script>

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAegv8Y_0KgMyjwQIt_ZXqb9_5PNj5TufY",
      authDomain: "ocean-study-classes.firebaseapp.com",
      projectId: "ocean-study-classes",
      storageBucket: "ocean-study-classes.firebasestorage.app",
      messagingSenderId: "549818570531",
      appId: "1:549818570531:web:355ec0212ab1ff984e1e96",
      measurementId: "G-3S5V3E056Z"
    };


    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();


    const form = document.getElementById("registerForm");
    const registerBtn = document.getElementById("registerBtn");
    const message = document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className = "message " + type;

      message.style.display = "block";
    }


    form.addEventListener("submit", async function(event) {

      event.preventDefault();
     const name = document.getElementById("name").value.trim();

      const mobile = document.getElementById("mobile").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;


      // Mobile validation
      if (!/^[0-9]{10}$/.test(mobile)) {

        showMessage(
          "Please enter a valid 10-digit mobile number.",
          "error"
        );

        return;
      }


      // Gmail validation
      if (!email.endsWith("@gmail.com")) {

        showMessage(
          "Please use a valid Gmail address.",
          "error"
        );

        return;
      }


      // Password validation
      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;
      }


      // Confirm password
      if (password !== confirmPassword) {

        showMessage(
          "Passwords do not match.",
          "error"
        );

        return;
      }


      registerBtn.disabled = true;
      registerBtn.textContent = "Creating Account...";


      try {

        // Create Firebase Authentication account
        const userCredential =
          await auth.createUserWithEmailAndPassword(
            email,
            password
          );


        const user = userCredential.user;


        // Save student profile in Firestore
        await db.collection("students").doc(user.uid).set({

          uid: user.uid,
          name:name,

          email: email,

          mobile: mobile,

          createdAt: firebase.firestore.FieldValue.serverTimestamp()

        });


        showMessage(
          "Registration successful! Redirecting to login...",
          "success"
        );


        form.reset();


        setTimeout(function() {

          window.location.href = "student-login.html";

        }, 2000);


      } catch (error) {

        console.error(error);


        let errorMessage = "Registration failed. Please try again.";


        if (error.code === "auth/email-already-in-use") {

          errorMessage =
            "This Gmail is already registered. Please login.";

        }

        else if (error.code === "auth/invalid-email") {

          errorMessage =
            "Please enter a valid Gmail address.";

        }

        else if (error.code === "auth/weak-password") {

          errorMessage =
            "Password is too weak. Please use a stronger password.";

        }


        showMessage(errorMessage, "error");


      } finally {

        registerBtn.disabled = false;

        registerBtn.textContent = "Create Account";

      }

    });

  </script>

</body>
</html>
